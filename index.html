<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FAZENDA MALUCA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    /* ========== CORES – TEMA CLARO (NATUREZA & ACOLHIMENTO) ========== */
    :root {
      --bg: #f5f0e8;
      --bg-alt: #e8dfd3;
      --surface: rgba(255, 252, 245, 0.75);
      --surface-solid: #fffaf2;
      --ink: #3e3a34;
      --ink-soft: #5f5546;
      --ink-faint: #8a7e6b;
      --gold: #d4a373;
      --gold-soft: #f5e6d3;
      --gold-dark: #b8895c;
      --sage: #6b8c42;
      --sage-soft: #dce8cd;
      --rose: #c77d7d;
      --rose-soft: #f2e0e0;
      --border: rgba(140, 120, 100, 0.25);
      --shadow: 0 8px 24px -8px rgba(80, 60, 40, 0.20);
      --radius: 18px;
    }

    /* ========== TEMA ESCURO (MAIS SOBRIO E ELEGANTE) ========== */
    [data-theme="dark"] {
      --bg: #28241e;
      --bg-alt: #1f1b16;
      --surface: rgba(50, 44, 38, 0.80);
      --surface-solid: #3d352c;
      --ink: #f0ebe4;
      --ink-soft: #d6cec4;
      --ink-faint: #a89b8d;
      --gold: #e6c384;
      --gold-soft: #4a4033;
      --gold-dark: #c9aa6a;
      --sage: #8aaa6b;
      --sage-soft: #3e4d2e;
      --rose: #c99a9a;
      --rose-soft: #4d3a3a;
      --border: rgba(200, 180, 160, 0.20);
      --shadow: 0 8px 24px -8px rgba(0, 0, 0, 0.6);
    }

    * {
      box-sizing: border-box;
      margin: 0;
    }
    body {
      background: radial-gradient(1200px 500px at 100% 0%, var(--gold-soft), transparent 70%),
                  radial-gradient(800px 400px at 0% 80%, var(--sage-soft), transparent 60%),
                  var(--bg);
      color: var(--ink);
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      min-height: 100vh;
      padding-bottom: 84px;
      transition: background 0.3s, color 0.3s;
    }
    h1,h2,h3 {
      font-family: 'Fraunces', serif;
    }
    button {
      font-family: inherit;
      cursor: pointer;
    }

    /* HEADER */
    header.top {
      position: sticky;
      top: 0;
      z-index: 40;
      backdrop-filter: blur(14px);
      background: linear-gradient(to bottom, var(--bg) 70%, transparent);
      padding: 10px 16px 6px;
    }
    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1080px;
      margin: 0 auto;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand .mark {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      background: linear-gradient(150deg, var(--gold), var(--gold-dark));
      display: flex;
      align-items: center;
      justify-content: center;
      color: #2d281f;
      font-size: 26px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .brand h1 {
      font-size: 26px;
      color: var(--ink);
    }
    .brand h1 span {
      color: var(--gold-dark);
    }
    .brand .sub {
      display: block;
      font-size: 12px;
      color: var(--sage);
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    #themeToggle {
      background: var(--surface);
      border: 2px solid var(--border);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      font-size: 20px;
      color: var(--ink);
      transition: 0.2s;
    }
    #themeToggle:hover {
      background: var(--gold-soft);
      border-color: var(--gold);
    }

    .stats-row {
      display: flex;
      gap: 6px;
      max-width: 1080px;
      margin: 8px auto 0;
      flex-wrap: wrap;
      justify-content: center;
    }
    .stat-pill {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 999px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: 14px;
      color: var(--ink);
      box-shadow: var(--shadow);
      backdrop-filter: blur(4px);
    }

    nav.desktop-nav {
      max-width: 1080px;
      margin: 10px auto 0;
      display: flex;
      gap: 4px;
      padding: 0 4px;
    }
    nav.desktop-nav button {
      flex: 1;
      background: transparent;
      border: none;
      padding: 10px 8px;
      border-radius: 12px;
      font-weight: 700;
      color: var(--ink-soft);
      font-size: 14px;
      transition: all .18s;
    }
    nav.desktop-nav button.active {
      background: var(--surface-solid);
      color: var(--gold-dark);
      border: 2px solid var(--gold);
      box-shadow: var(--shadow);
    }

    nav.bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 50;
      display: none;
      background: var(--surface-solid);
      border-top: 2px solid var(--border);
      padding: 6px 2px 8px;
    }
    nav.bottom-nav .row {
      display: flex;
    }
    nav.bottom-nav button {
      flex: 1;
      background: none;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      font-size: 11px;
      font-weight: 700;
      color: var(--ink-faint);
      padding: 6px 2px;
    }
    nav.bottom-nav button .ic {
      font-size: 22px;
    }
    nav.bottom-nav button.active {
      color: var(--gold-dark);
    }

    main {
      max-width: 1080px;
      margin: 12px auto 30px;
      padding: 0 12px;
    }
    .page {
      animation: fadein .3s ease;
    }
    @keyframes fadein {
      from { opacity:0; transform:translateY(4px); }
      to { opacity:1; transform:translateY(0); }
    }

    .card {
      background: var(--surface);
      backdrop-filter: blur(8px);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
      color: var(--ink);
      transition: background 0.2s, border-color 0.2s;
    }
    .card h2 {
      margin: 0 0 6px;
      font-size: 22px;
      color: var(--gold-dark);
      font-weight: 700;
    }
    .card .hint {
      color: var(--ink-faint);
      font-size: 14px;
      margin: 0 0 14px;
    }

    .grid-cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 10px;
    }
    .item-card {
      background: var(--surface-solid);
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 14px 10px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: all .2s;
      color: var(--ink);
    }
    .item-card .emoji {
      font-size: 32px;
      width: 56px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(150deg, var(--gold-soft), var(--sage-soft));
      border-radius: 50%;
      margin-bottom: 2px;
    }
    .item-card .name {
      font-size: 14px;
      font-weight: 800;
      color: var(--ink);
    }
    .item-card .desc {
      font-size: 12px;
      color: var(--ink-faint);
      line-height: 1.4;
    }
    .item-card .meta {
      font-size: 12px;
      color: var(--ink-faint);
    }
    .item-card .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin-top: 6px;
    }
    .item-card .actions button {
      font-size: 12px;
      padding: 4px 12px;
    }
    .item-card.locked {
      opacity: 0.55;
      border-color: var(--rose);
    }
    .item-card.owned {
      border-color: var(--sage);
      box-shadow: 0 0 0 3px var(--sage-soft) inset;
    }
    .item-card.owned .name::after {
      content: " ✅";
    }

    .btn {
      border: 2px solid var(--border);
      background: var(--surface-solid);
      color: var(--ink);
      border-radius: 12px;
      padding: 9px 18px;
      font-weight: 700;
      font-size: 14px;
      transition: transform .1s, box-shadow .1s, background .2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }
    .btn.primary {
      background: var(--sage);
      color: #fff;
      border-color: var(--sage);
    }
    .btn.primary:hover {
      background: var(--gold-dark);
      border-color: var(--gold-dark);
    }
    .btn.gold {
      background: var(--gold);
      color: #2d281f;
      border-color: var(--gold);
    }
    .btn.gold:hover {
      background: var(--gold-dark);
      border-color: var(--gold-dark);
    }
    .btn.sage {
      background: var(--sage);
      color: #fff;
      border-color: var(--sage);
    }
    .btn.sage:hover {
      background: #5a7a38;
      border-color: #5a7a38;
    }
    .btn.rose {
      background: var(--rose);
      color: #fff;
      border-color: var(--rose);
    }
    .btn.rose:hover {
      background: #b06a6a;
      border-color: #b06a6a;
    }
    .btn.ghost {
      background: transparent;
      color: var(--ink-soft);
      border-color: var(--border);
    }
    .btn.ghost:hover {
      background: var(--surface);
    }
    .btn.small {
      padding: 6px 12px;
      font-size: 12px;
    }
    .btn:disabled {
      opacity: .4;
      cursor: not-allowed;
      transform: none !important;
    }

    /* Layout dos botões de ferramentas */
    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: flex-start;
    }
    .btn-row .btn {
      flex: 0 1 auto;
      min-width: 120px;
      justify-content: center;
    }

    .timer-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 4px 0;
    }
    .timer-stage {
      position: relative;
      width: 230px;
      height: 230px;
    }
    .timer-stage svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }
    .timer-stage .track {
      fill: none;
      stroke: var(--border);
      stroke-width: 10;
    }
    .timer-stage .bar {
      fill: none;
      stroke: var(--gold);
      stroke-width: 10;
      stroke-linecap: round;
      transition: stroke-dashoffset .3s linear;
    }
    .timer-stage.pausa .bar {
      stroke: var(--sage);
    }
    .timer-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .timer-center .time {
      font-family: 'Fraunces', serif;
      font-size: 48px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--ink);
    }
    .timer-center .mode {
      font-size: 13px;
      color: var(--ink-faint);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
    }

    .toast-stack {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-items: center;
    }
    .toast {
      background: var(--gold);
      color: #2d281f;
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
      box-shadow: var(--shadow);
      animation: toastin .25s ease;
    }
    @keyframes toastin {
      from { opacity:0; transform:translateY(-6px); }
      to { opacity:1; transform:translateY(0); }
    }

    #confettiCanvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 150;
    }

    .notificacao {
      background: var(--surface-solid);
      border-left: 4px solid var(--gold);
      padding: 8px 12px;
      margin-bottom: 6px;
      border-radius: 8px;
      font-size: 14px;
      color: var(--ink);
      display: flex;
      justify-content: space-between;
    }
    .notificacao .data {
      font-size: 11px;
      color: var(--ink-faint);
    }

    /* AVATAR */
    .avatar-wrapper {
      background: var(--surface);
      backdrop-filter: blur(8px);
      border-radius: 20px;
      padding: 20px;
      border: 2px solid var(--border);
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }
    .avatar-top {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    .avatar-personagem {
      font-size: 56px;
      background: var(--surface-solid);
      padding: 8px 20px;
      border-radius: 60px;
      border: 2px solid var(--border);
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.06);
      min-width: 80px;
      text-align: center;
    }
    .avatar-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .avatar-info .nome {
      font-size: 22px;
      font-weight: 800;
      color: var(--ink);
    }
    .avatar-progresso {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-faint);
    }
    .avatar-progresso .bar {
      flex: 1;
      height: 6px;
      background: var(--bg-alt);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--border);
      min-width: 60px;
    }
    .avatar-progresso .bar i {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, var(--gold), var(--gold-dark));
    }
    .sex-selector {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .sex-selector button {
      padding: 6px 16px;
      border-radius: 999px;
      border: 2px solid var(--border);
      background: var(--surface-solid);
      font-weight: 700;
      font-size: 24px;
      color: var(--ink);
      line-height: 1.2;
      min-width: 60px;
      transition: 0.2s;
    }
    .sex-selector button.active {
      background: var(--gold);
      color: #2d281f;
      border-color: var(--gold);
    }
    .avatar-vitrine {
      margin-top: 14px;
      border-top: 2px dashed var(--border);
      padding-top: 14px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
      gap: 8px;
    }
    .avatar-vitrine .item-mini {
      background: var(--surface-solid);
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 6px 4px;
      text-align: center;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: var(--ink);
    }
    .avatar-vitrine .item-mini .emoji {
      font-size: 22px;
    }
    .avatar-vitrine .item-mini .label {
      font-size: 9px;
      color: var(--ink-faint);
      line-height: 1.2;
    }
    .avatar-vitrine .vazio {
      grid-column: 1/-1;
      text-align: center;
      color: var(--ink-faint);
      font-size: 14px;
      padding: 10px 0;
    }

    /* EVENTOS */
    .eventos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
      max-height: 600px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .evento-card {
      background: var(--surface-solid);
      border-radius: 16px;
      padding: 18px;
      border: 2px solid var(--border);
      transition: all .2s;
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
      color: var(--ink);
    }
    .evento-card.done {
      border-color: var(--sage);
      background: var(--sage-soft);
      opacity: 0.8;
    }
    .evento-card .topo {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .evento-card .topo .icone {
      font-size: 28px;
    }
    .evento-card .topo .titulo {
      font-weight: 800;
      font-size: 18px;
      color: var(--ink);
      flex: 1;
    }
    .evento-card .badge-status {
      font-size: 12px;
      font-weight: 700;
      padding: 3px 12px;
      border-radius: 999px;
      background: var(--gold-soft);
      color: #2d281f;
      white-space: nowrap;
    }
    .evento-card .badge-status.feito {
      background: var(--sage-soft);
      color: var(--sage);
    }
    .evento-card .descricao {
      font-size: 14px;
      color: var(--ink-soft);
      background: var(--surface);
      padding: 8px 12px;
      border-radius: 10px;
      line-height: 1.5;
    }
    .evento-card .requisitos {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 2px 0;
    }
    .evento-card .requisitos span {
      background: var(--surface);
      padding: 3px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-soft);
      border: 1px solid var(--border);
    }
    .evento-card .requisitos span.req-pomo {
      background: var(--gold-soft);
      color: #2d281f;
    }
    .evento-card .recompensa {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      font-weight: 700;
      color: #2d281f;
      background: var(--gold);
      padding: 5px 14px;
      border-radius: 999px;
      align-self: flex-start;
    }
    .evento-card .recompensa .brinde {
      font-weight: 400;
      color: #2d281f;
      font-size: 13px;
    }
    .evento-card .acoes {
      margin-top: 4px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .sub-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .sub-tabs button {
      padding: 7px 16px;
      border-radius: 999px;
      border: 2px solid var(--border);
      background: var(--surface-solid);
      font-weight: 700;
      font-size: 13px;
      color: var(--ink);
      transition: 0.2s;
    }
    .sub-tabs button.active {
      background: var(--gold);
      color: #2d281f;
      border-color: var(--gold);
    }

    .vitrine-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 8px;
      margin-top: 10px;
    }
    .vitrine-item {
      background: var(--surface-solid);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 10px 6px;
      text-align: center;
      font-size: 13px;
      color: var(--ink);
    }
    .vitrine-item .emoji {
      font-size: 26px;
      width: 46px;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 4px;
      background: linear-gradient(150deg, var(--gold-soft), var(--sage-soft));
      border-radius: 50%;
    }
    .vitrine-item .label {
      font-size: 11px;
      color: var(--ink-faint);
    }

    .curiosidade-box {
      background: var(--gold-soft);
      border-radius: 12px;
      padding: 12px 16px;
      text-align: center;
      font-size: 15px;
      color: var(--ink);
      border-left: 4px solid var(--gold);
      margin-top: 8px;
      min-height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, color 0.2s;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 600;
      color: var(--ink-soft);
      margin-bottom: 2px;
    }
    .progress-bar {
      height: 6px;
      background: var(--bg-alt);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .progress-bar i {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, var(--gold), var(--gold-dark));
    }

    .emblema-item {
      background: var(--surface-solid);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 8px 14px;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      color: var(--ink);
    }
    .emblema-item .nome {
      font-weight: 700;
    }
    .emblema-item .status {
      font-size: 13px;
      color: var(--ink-faint);
    }
    .emblema-item.feito {
      border-color: var(--sage);
      background: var(--sage-soft);
    }
    .emblema-item.feito .status {
      color: var(--sage);
    }

    .proximos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 8px;
      margin-top: 6px;
    }
    .proximo-item {
      background: var(--surface-solid);
      border: 2px solid var(--border);
      border-radius: 10px;

      let state = loadState();

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return defaultState();
          const parsed = JSON.parse(raw);
          const base = defaultState();
          for (let k in base) {
            if (parsed[k] !== undefined) {
              if (k === 'tasksDone' && parsed[k].length !== TOTAL_TASKS) {
                parsed[k] = new Array(TOTAL_TASKS).fill(false);
              }
              base[k] = parsed[k];
            }
          }
          if (!base.tasksDone || base.tasksDone.length !== TOTAL_TASKS) {
            base.tasksDone = new Array(TOTAL_TASKS).fill(false);
          }
          return base;
        } catch (e) {
          console.error('Erro ao carregar estado', e);
          return defaultState();
        }
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));

      function toast(msg) {
        const stack = document.getElementById('toastStack');
        const el = document.createElement('div');
        el.className = 'toast';
        el.textContent = msg;
        stack.appendChild(el);
        setTimeout(() => {
          el.style.transition = 'opacity .3s';
          el.style.opacity = '0';
          setTimeout(() => el.remove(), 300);
        }, 5000);
      }

      function launchConfetti(qtd = 50) {
        const colors = ['#d4a373','#b8895c','#6b8c42','#c77d7d','#e6c384'];
        const canvas = document.getElementById('confettiCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        let particles = [];
        for (let i=0; i<qtd; i++) {
          particles.push({
            x: canvas.width/2 + (Math.random()-0.5)*canvas.width*0.5,
            y: -10 - Math.random()*60,
            vx: (Math.random()-0.5)*4,
            vy: 2 + Math.random()*4,
            size: 3 + Math.random()*5,
            color: colors[Math.floor(Math.random()*colors.length)],
            life: 0
          });
        }
        let raf;
        function anim() {
          ctx.clearRect(0,0,canvas.width,canvas.height);
          particles = particles.filter(p => p.life < 120 && p.y < canvas.height+20);
          particles.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.04;
            p.life++;
            ctx.fillStyle = p.color;
            ctx.globalAlpha = 1 - p.life/130;
            ctx.fillRect(p.x-3, p.y-3, p.size, p.size*0.6);
          });
          if (particles.length) raf = requestAnimationFrame(anim);
        }
        anim();
      }

        let novos = false;
        EMBLEMAS.forEach(e => {
          if (!state.emblemas.includes(e.id) && e.cond(state)) {
            state.emblemas.push(e.id);
            toast(`🏅 Emblema desbloqueado: ${e.emoji} ${e.label}`);
            launchConfetti(40);
            pushNotificacao(`🏅 ${e.emoji} ${e.label}`);
            novos = true;
          }
        });
        if (novos) saveState();

        for (let ev of EVENTOS) {

      function usuarioPossuiItem(chave) {
        return state.animais[chave] ||
               state.plantacoes[chave] ||
               state.avatar[chave] ||
               state.produtos[chave] ||
               state.investimentos.includes(chave) ||

               state.doacoes[chave] ||
               state.doacoesDoadas[chave] ||
               false;

      function adquirirItem(tipo, key) {
        let lista;
        if (tipo === 'animais') lista = ANIMAIS;
        else if (tipo === 'plantacoes') lista = PLANTACOES;
        else lista = AVATAR_ITENS;
        const item = lista.find(i => i.key === key);
        if (!item) return;
        if (state[tipo][key]) {
          toast('✅ Você já possui este item.');
          return;
        }
        if (state.pomodoros.total < item.requisito) {
          toast(`🔥 Você precisa de ${item.requisito} pomodoros para adquirir ${item.label}.`);
          return;
        }
        state[tipo][key] = true;
        pushNotificacao(`+ ${item.emoji} ${item.label} adquirido!`);
        toast(`✅ ${item.emoji} ${item.label} adquirido!`);
        launchConfetti(30);
        verificarEmblemas();
        saveState();
        renderAll();
      }

      function exportarAnotacoesCSV() {
        if (state.anotacoes.length === 0) {
          toast('📭 Nenhuma anotação para exportar.');
          return;
        }
        let csv = 'Data,Hora,Anotação\n';
        state.anotacoes.forEach(a => {
          csv += `"${a.data}","${a.hora}","${a.texto.replace(/"/g, '""')}"\n`;
        });
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        const url = URL.createObjectURL(blob);
        link.href = url;
        link.download = `anotacoes_${todayStr()}.csv`;
        link.click();
        URL.revokeObjectURL(url);
        toast('📥 Anotações exportadas!');
      }

        const t = todayStr();
        if (state.pomodoros.ultimaData !== t) {
          state.pomodoros.hoje = 0;
          state.pomodoros.ultimaData = t;
        }
      }

      // =============================================================
      // TIMER
      // =============================================================
      let timerInterval = null;

      function startTimerLoop() {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
          if (!state.timer.running) return;
          state.timer.remaining--;
          if (state.timer.remaining <= 0) {
            onTimerZero();
          }
          saveState();
          renderTimerFace();
        }, 1000);
      }

      function onTimerZero() {
        state.timer.running = false;
        if (state.timer.mode === 'foco') {
          state.timer.ciclos++;
          if (state.timer.ciclos >= 4) {
            state.timer.mode = 'pausaLonga';
            state.timer.ciclos = 0;
            state.timer.remaining = PAUSA_LONGA_DUR;
          } else {
            state.timer.mode = 'pausaCurta';
            state.timer.remaining = PAUSA_CURTA_DUR;
          }
          finalizarPomodoro();
        } else {
          state.timer.mode = 'foco';
          state.timer.remaining = FOCO_DUR;
          toast('☀️ Pausa terminou — hora de focar!');
        }
      }

      function finalizarPomodoro() {
        ensureDay();
        state.pomodoros.total++;
        state.pomodoros.hoje++;
        const hoje = todayStr();
        let diario = state.pomodorosDiarios.find(d => d.data === hoje);
        if (diario) diario.count = (diario.count||0) + 1;
        else state.pomodorosDiarios.push({ data: hoje, count: 1 });
        if (state.pomodorosDiarios.length > 30) state.pomodorosDiarios.shift();
        const idx = state.curiosidadeIndex % CURIOSIDADES.length;
        const curiosidade = CURIOSIDADES[idx];
        state.curiosidadeIndex++;
        toast(`💡 ${curiosidade}`);
        launchConfetti(25);
        if (state.pomodoros.hoje === 5) {
          state.dinheiro += 5;
          toast('🎉 Meta diária batida! +R$5 bônus');
        }
        verificarEmblemas();
        verificarEventos();
        saveState();
        renderAll();
      }

      function toggleRunning() {
        state.timer.running = !state.timer.running;
        saveState();
        renderTimerFace();
      }

      function resetTimer() {
        const dur = state.timer.mode === 'foco' ? FOCO_DUR : state.timer.mode === 'pausaCurta' ? PAUSA_CURTA_DUR : PAUSA_LONGA_DUR;
        state.timer.remaining = dur;
        state.timer.running = false;
        saveState();
        renderTimerFace();
      }

      function renderTimerFace() {
        const el = document.getElementById('timerFace');
        if (!el) return;
        const dur = state.timer.mode === 'foco' ? FOCO_DUR : state.timer.mode === 'pausaCurta' ? PAUSA_CURTA_DUR : PAUSA_LONGA_DUR;
        const frac = 1 - (state.timer.remaining / dur);
        const circumference = 2 * Math.PI * 100;
        const offset = circumference * (1 - frac);
        const mm = String(Math.floor(Math.max(0, state.timer.remaining) / 60)).padStart(2, '0');
        const ss = String(Math.max(0, state.timer.remaining) % 60).padStart(2, '0');
        const modeLabel = state.timer.mode === 'foco' ? 'Foco' : state.timer.mode === 'pausaCurta' ? 'Pausa' : 'Pausa longa';
        el.querySelector('.bar').style.strokeDashoffset = offset;
        el.querySelector('.time').textContent = mm + ':' + ss;
        el.querySelector('.mode').textContent = modeLabel;
        el.parentElement.classList.toggle('pausa', state.timer.mode !== 'foco');
        const runBtn = document.getElementById('runBtn');
        if (runBtn) runBtn.textContent = state.timer.running ? '⏸ Pausar' : '▶ Iniciar';
      }

      function manualComplete() {
        ensureDay();
        finalizarPomodoro();
      }

      // =============================================================
      // RENDERIZAÇÃO
      // =============================================================
      const TABS = [
        { key: 'foco', label: 'Foco', ic: '🎯' },
        { key: 'rocar', label: 'Roçar', ic: '🐄' },
        { key: 'produzir', label: 'Produzir', ic: '🧀' },
        { key: 'eventos', label: 'Eventos', ic: '🎉' },
        { key: 'feira', label: 'Feira', ic: '🚜' },
        { key: 'progresso', label: 'Progresso', ic: '📊' }
      ];

      let currentTab = 'foco';
      let subTabRocar = 'animais';
      let subTabProduzir = 'produtos';

      function buildNav() {
        const dn = document.getElementById('desktopNav');
        dn.innerHTML = TABS.map(t => `<button data-tab="${t.key}" class="${t.key===currentTab?'active':''}">${t.ic} ${t.label}</button>`).join('');
        dn.querySelectorAll('button').forEach(b => b.onclick = () => showTab(b.dataset.tab));
        const bn = document.querySelector('#bottomNav .row');
        bn.innerHTML = TABS.map(t => `<button data-tab="${t.key}" class="${t.key===currentTab?'active':''}"><span class="ic">${t.ic}</span>${t.label}</button>`).join('');
        bn.querySelectorAll('button').forEach(b => b.onclick = () => showTab(b.dataset.tab));
      }

      function showTab(tab) {
        currentTab = tab;
        buildNav();
        renderAll();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      function atualizarStats() {
        document.getElementById('statPomodoros').textContent = state.pomodoros.total;
        document.getElementById('statDinheiro').textContent = Math.round(state.dinheiro);
        document.getElementById('statAnimais').textContent = Object.keys(state.animais).filter(k=>state.animais[k]).length;
        document.getElementById('statPlantacoes').textContent = Object.keys(state.plantacoes).filter(k=>state.plantacoes[k]).length;
        document.getElementById('statAvatar').textContent = Object.keys(state.avatar).filter(k=>state.avatar[k]).length;
        document.getElementById('statRaros').textContent = state.itensRaros.length;
        document.getElementById('statDoacoes').textContent = Object.keys(state.doacoesDoadas).filter(k=>state.doacoesDoadas[k]).length;
      }

      function renderVitrineFazenda() {
        const allItems = [];
        Object.keys(state.animais).filter(k=>state.animais[k]).forEach(k => {
          const a = ANIMAIS.find(i => i.key === k);
          if (a) allItems.push({emoji:a.emoji, label:a.label});

        Object.keys(state.plantacoes).filter(k=>state.plantacoes[k]).forEach(k => {
          const p = PLANTACOES.find(i => i.key === k);
          if (p) allItems.push({emoji:p.emoji, label:p.label});
        });
        Object.keys(state.avatar).filter(k=>state.avatar[k]).forEach(k => {
          const av = AVATAR_ITENS.find(i => i.key === k);
          if (av) allItems.push({emoji:av.emoji, label:av.label});
        });
        state.investimentos.forEach(k => {
          const inv = INVESTIMENTOS.find(i => i.key === k);
          if (inv) allItems.push({emoji:inv.emoji, label:inv.label});
        });
        state.itensRaros.forEach(k => {
          const r = ITENS_RAROS.find(i => i.key === k);
          if (r) allItems.push({emoji:r.emoji, label:r.label});

          return `<div style="grid-column:1/-1;padding:20px;text-align:center;color:var(--ink-faint);">Nenhum item ainda.</div>`;

        let html = '<div class="vitrine-grid">';
        allItems.forEach(item => {
          html += `<div class="vitrine-item"><span class="emoji">${item.emoji}</span><span class="label">${item.label}</span></div>`;
        });
        html += '</div>';
        return html;
      }

      function renderVitrineVendidos() {
        const vendidos = Object.keys(state.produtosVendidos).filter(k => state.produtosVendidos[k]);
        if (vendidos.length === 0) {
          return `<div style="grid-column:1/-1;padding:20px;text-align:center;color:var(--ink-faint);">Nenhum produto vendido ainda.</div>`;
        }
        let html = '<div class="vitrine-grid">';
        vendidos.forEach(k => {
          const p = PRODUTOS.find(item => item.key === k);

        });
        html += '</div>';
        return html;
      }

      function renderVitrineDoados() {
        const doados = Object.keys(state.doacoesDoadas).filter(k => state.doacoesDoadas[k]);
        if (doados.length === 0) {
          return `<div style="grid-column:1/-1;padding:20px;text-align:center;color:var(--ink-faint);">Nenhum item doado ainda.</div>`;
        }
        let html = '<div class="vitrine-grid">';
        doados.forEach(k => {
          const d = PRODUTOS_DOACAO.find(item => item.key === k);
          if (d) html += `<div class="vitrine-item"><span class="emoji">${d.emoji}</span><span class="label">${d.label}</span></div>`;
        });
        html += '</div>';
        return html;
      }

      function renderVitrineRaros() {
        const raros = state.itensRaros;
        if (raros.length === 0) {
          return `<div style="grid-column:1/-1;padding:20px;text-align:center;color:var(--ink-faint);">Nenhum item raro adquirido ainda.</div>`;
        }
        let html = '<div class="vitrine-grid">';
        raros.forEach(k => {

          if (item) html += `<div class="vitrine-item"><span class="emoji">${item.emoji}</span><span class="label">${item.label}</span></div>`;
        });
        html += '</div>';

      // =============================================================
      // RENDER AVATAR (com nome)
      // =============================================================
      function renderAvatar(showSexSelector = true) {
        const sexoEmoji = state.avatarSexo === 'masculino' ? '👨' : state.avatarSexo === 'feminino' ? '👩' : '🧑';
        const itensAvatar = Object.keys(state.avatar).filter(k => state.avatar[k]);
        const total = AVATAR_ITENS.length;
        const adquiridos = itensAvatar.length;
        const pct = Math.round((adquiridos / total) * 100);

        let vitrineHtml = '';
        if (itensAvatar.length > 0) {
          vitrineHtml = itensAvatar.map(key => {
            const item = AVATAR_ITENS.find(i => i.key === key);
            return item ? `<div class="item-mini"><span class="emoji">${item.emoji}</span><span class="label">${item.label}</span></div>` : '';
          }).join('');
        } else {
          vitrineHtml = '<div class="vazio">Nenhum item de avatar adquirido ainda.</div>';
        }

        let sexSelectorHtml = '';
        if (showSexSelector) {
          sexSelectorHtml = `
            <div class="sex-selector">
              <button class="${state.avatarSexo === 'unisex'?'active':''}" onclick="App.mudarSexo('unisex')">🧑</button>
              <button class="${state.avatarSexo === 'masculino'?'active':''}" onclick="App.mudarSexo('masculino')">👨</button>
              <button class="${state.avatarSexo === 'feminino'?'active':''}" onclick="App.mudarSexo('feminino')">👩</button>
            </div>
          `;
        }

        return `
          <div class="avatar-wrapper">
            <div class="avatar-top">
              <div class="avatar-personagem">${sexoEmoji}</div>
              <div class="avatar-info">
                <div class="nome">${state.avatarNome}</div>
                <div class="avatar-progresso">
                  <span>🎨 ${adquiridos}/${total}</span>
                  <div class="bar"><i style="width:${pct}%;"></i></div>
                  <span>${pct}%</span>
                </div>
              </div>
            </div>
            ${sexSelectorHtml}
            <div class="avatar-vitrine">
              ${vitrineHtml}
            </div>
          </div>
        `;
      }

      // =============================================================
      // FUNÇÕES PARA PRÓXIMO EVENTO E PRÓXIMOS ITENS
      // =============================================================
      function getProximoEvento() {
        for (let ev of EVENTOS) {
          if (!state.eventosConcluidos.includes(ev.id)) {
            return ev;
          }
        }
        return null;
      }

      function getProximosItens() {
        const categorias = [
          { lista: ANIMAIS, tipo: 'animais', label: 'Animais' },
          { lista: PLANTACOES, tipo: 'plantacoes', label: 'Plantações' },
          { lista: AVATAR_ITENS, tipo: 'avatar', label: 'Avatar' },
          { lista: PRODUTOS, tipo: 'produtos', label: 'Produtos' }
        ];
        const resultado = {};
        categorias.forEach(cat => {
          const naoAdquiridos = cat.lista.filter(item => !state[cat.tipo][item.key]);
          naoAdquiridos.sort((a,b) => a.requisito - b.requisito);
          resultado[cat.tipo] = naoAdquiridos.slice(0, 3);
        });
        return resultado;
      }

      // RENDER ABAS
      // =============================================================

          ${fazendaHtml}
          ${tutorialHtml}

      function renderRocar() {

          <div class="sub-tabs">
            <button class="${subTabRocar==='animais'?'active':''}" onclick="App.setSubTabRocar('animais')">🐄 Animais</button>

          lista = ANIMAIS; tipo = 'animais'; titulo = 'Animais';

          lista = PLANTACOES; tipo = 'plantacoes'; titulo = 'Plantações';
        } else {
          lista = AVATAR_ITENS; tipo = 'avatar'; titulo = 'Itens de Avatar';

        let gridHtml = `<div class="grid-cards">`;
        lista.forEach(item => {
          const possui = state[tipo][item.key] || false;
          const bloqueado = state.pomodoros.total < item.requisito;
          gridHtml += `
            <div class="item-card ${possui?'owned':''} ${bloqueado && !possui?'locked':''}">

              <div class="meta">Requer: ${item.requisito}🔥</div>

                  bloqueado ? `<span style="font-size:13px;color:var(--rose);">🔒 ${item.requisito}🔥</span>` :

        });
        gridHtml += `</div>`;
        return `

          <div class="sub-tabs">

        `;

        if (subTabProduzir === 'produtos') {
          let gridHtml = `<div class="grid-cards">`;
          PRODUTOS.sort((a,b) => a.requisito - b.requisito).forEach(p => {
            const produzido = state.produtos[p.key] || false;
            const vendido = state.produtosVendidos[p.key] || false;
            const bloqueado = state.pomodoros.total < p.requisito;
            gridHtml += `
              <div class="item-card ${produzido?'owned':''} ${bloqueado && !produzido?'locked':''}">
                <div class="emoji">${p.emoji}</div>
                <div class="name">${p.label}</div>
                <div class="desc">${p.desc || ''}</div>
                <div class="meta">Requer: ${p.requisito}🔥 | Venda: R$${p.preco}</div>
                <div class="meta">${produzido ? (vendido ? '✅ Vendido' : '📦 Produzido') : '🔒 Não produzido'}</div>
                <div class="actions">
                  ${!produzido ? (bloqueado ? `<span style="font-size:13px;color:var(--rose);">🔒 ${p.requisito}🔥</span>` :
                    `<button class="btn small sage" onclick="App.produzirProduto('${p.key}')">Produzir</button>`) :
                    (vendido ? `<span style="font-size:13px;color:var(--sage);">✅ Vendido</span>` :
                    `<button class="btn small gold" onclick="App.venderProduto('${p.key}')">Vender (R$${p.preco})</button>`)}
                </div>
              </div>
            `;
          });
          gridHtml += `</div>`;
          content = `
            <div class="card">
              <h2>🧀 Produzir e Vender</h2>
              <p class="hint">Produza cada produto uma vez (com pomodoros) e venda por dinheiro.</p>
              ${gridHtml}
            </div>
          `;
        } else {
          let gridHtml = `<div class="grid-cards">`;
          PRODUTOS_DOACAO.forEach(item => {
            const produzido = state.doacoes[item.key] || false;
            const doado = state.doacoesDoadas[item.key] || false;
            const bloqueado = state.pomodoros.total < item.custo;
            gridHtml += `
              <div class="item-card ${produzido?'owned':''} ${bloqueado && !produzido?'locked':''}">
                <div class="emoji">${item.emoji}</div>
                <div class="name">${item.label}</div>
                <div class="desc">${item.desc || ''}</div>
                <div class="meta">Custo: ${item.custo}🔥</div>
                <div class="meta">${produzido ? (doado ? '✅ Doado' : '📦 Produzido') : '🔒 Não produzido'}</div>
                <div class="actions">
                  ${!produzido ? (bloqueado ? `<span style="font-size:13px;color:var(--rose);">🔒 ${item.custo}🔥</span>` :
                    `<button class="btn small sage" onclick="App.produzirDoacao('${item.key}')">Produzir</button>`) :
                    (doado ? `<span style="font-size:13px;color:var(--sage);">✅ Doado</span>` :
                    `<button class="btn small gold" onclick="App.doarProduto('${item.key}')">Doar</button>`)}
                </div>
              </div>
            `;
          });
          gridHtml += `</div>`;
          content = `
            <div class="card">
              <h2>💝 Doações</h2>
              <p class="hint">Produza itens para doação (gaste pomodoros) e doe para causas sociais. Cada item é único.</p>
              ${gridHtml}
            </div>
          `;
        }
        return `
          <div class="card">${subHtml}</div>
          ${content}
        `;
      }

      // EVENTOS
      function renderEventos() {
        const eventosOrdenados = EVENTOS.sort((a,b) => a.reqPomodoros - b.reqPomodoros);
        let eventosHtml = `<div class="eventos-grid">`;
        eventosOrdenados.forEach(e => {
          const concluido = state.eventosConcluidos.includes(e.id);
          const pode = state.pomodoros.total >= e.reqPomodoros && !concluido;
          let temItens = true;
          for (let req of e.reqItens) {
            if (!usuarioPossuiItem(req)) {
              temItens = false;
              break;
            }
          }
          const podeCompleto = pode && temItens;
          const brindeStr = e.brinde ? `${e.brinde.emoji} ${e.brinde.label}` : '';
          eventosHtml += `
            <div class="evento-card ${concluido ? 'done' : ''}">
              <div class="topo">
                <span class="icone">${e.icone}</span>
                <span class="titulo">${e.label}</span>
                <span class="badge-status ${concluido ? 'feito' : ''}">${concluido ? '✅ Concluído' : (podeCompleto ? '📅 Disponível' : '🔒 Bloqueado')}</span>
              </div>
              <div class="descricao">${e.desc || ''}</div>
              <div class="requisitos">
                <span class="req-pomo">🔥 ${e.reqPomodoros}</span>
                ${e.reqItens.map(item => `<span>${item}</span>`).join('')}
              </div>
              <div class="recompensa">
                <span>💰 R$${e.premio}</span>
                ${brindeStr ? `<span class="brinde">🎁 ${brindeStr}</span>` : ''}
              </div>
              <div class="acoes">
                <button class="btn gold small" onclick="App.participarEvento('${e.id}')" ${podeCompleto ? '' : 'disabled'}>
                  Participar
                </button>
                ${concluido ? '<span style="font-size:13px;color:var(--sage);">✅ Já participou</span>' : ''}
              </div>
            </div>
          `;
        });
        eventosHtml += `</div>`;
        return `
          <div class="card">
            <h2>🎉 Eventos (${EVENTOS.length})</h2>
            <p class="hint">Participe de eventos para ganhar dinheiro e brindes raros. Cada evento é único!</p>
            ${eventosHtml}
          </div>
        `;
      }

      function renderFeira() {
        let investHtml = `<div class="grid-cards">`;
        INVESTIMENTOS.sort((a,b) => a.requisito - b.requisito).forEach(inv => {
          const possui = state.investimentos.includes(inv.key);
          const bloqueado = state.pomodoros.total < inv.requisito || state.dinheiro < inv.preco;
          investHtml += `
            <div class="item-card ${possui?'owned':''} ${bloqueado && !possui?'locked':''}">
              <div class="emoji">${inv.emoji}</div>
              <div class="name">${inv.label}</div>
              <div class="desc">${inv.desc || ''}</div>
              <div class="meta">Requer: ${inv.requisito}🔥 | R$${inv.preco}</div>
              <div class="actions">
                ${possui ? `<span style="font-size:13px;color:var(--sage);">✅ Possui</span>` :
                  `<button class="btn small gold" onclick="App.comprarInvestimento('${inv.key}')" ${bloqueado?'disabled':''}>Comprar</button>`}
              </div>
            </div>
          `;
        });
        investHtml += `</div>`;

        let rarosHtml = `<div class="grid-cards">`;
        ITENS_RAROS.forEach(item => {
          const possui = state.itensRaros.includes(item.key);
          const pode = state.dinheiro >= item.preco && !possui;
          rarosHtml += `
            <div class="item-card ${possui?'owned':''} ${!possui && !pode?'locked':''}">
              <div class="emoji">${item.emoji}</div>
              <div class="name">${item.label}</div>
              <div class="desc">${item.desc || ''}</div>
              <div class="meta">R$${item.preco}</div>
              <div class="actions">
                ${possui ? `<span style="font-size:13px;color:var(--sage);">✅ Adquirido</span>` :
                  `<button class="btn small gold" onclick="App.comprarItemRaro('${item.key}')" ${pode?'':'disabled'}>Comprar</button>`}
              </div>
            </div>
          `;
        });
        rarosHtml += `</div>`;

        const totalRaros = ITENS_RAROS.length;
        const compradosRaros = state.itensRaros.length;
        const totalInvest = INVESTIMENTOS.length;
        const compradosInvest = state.investimentos.length;
        const totalGasto = state.itensRaros.reduce((acc, key) => {
          const item = ITENS_RAROS.find(i => i.key === key);
          return acc + (item ? item.preco : 0);
        }, 0) + state.investimentos.reduce((acc, key) => {
          const inv = INVESTIMENTOS.find(i => i.key === key);
          return acc + (inv ? inv.preco : 0);
        }, 0);

        return `
          <div class="card">
            <h2>🚜 Feira da Fazenda</h2>
            <div style="display:flex; gap:12px; flex-wrap:wrap; margin-bottom:12px; font-size:14px;">
              <span>💰 Dinheiro: R$ ${Math.round(state.dinheiro)}</span>
              <span>✨ Raros: ${compradosRaros}/${totalRaros}</span>
              <span>🚜 Investimentos: ${compradosInvest}/${totalInvest}</span>
              <span>💸 Gasto total: R$ ${totalGasto}</span>
            </div>
            <p class="hint">Compre investimentos e itens raros com o dinheiro ganho vendendo produtos.</p>
          </div>
          <div class="card">
            <h2>🚜 Investimentos</h2>
            <p class="hint">Melhorias para sua fazenda. Cada um requer pomodoros e dinheiro.</p>
            ${investHtml}
          </div>
          <div class="card">
            <h2>✨ Itens Raros</h2>
            <p class="hint">Itens únicos e valiosos. Compre todos para completar sua coleção!</p>
            ${rarosHtml}
          </div>
        `;
      }

      function renderProgresso() {
        // Notificações (último)
        let notificacoesHtml = state.notificacoes.slice(0, 20).map(n => `
          <div class="notificacao">
            <span>${n.texto}</span>
            <span class="data">${new Date(n.ts).toLocaleDateString('pt-BR')}</span>
          </div>
        `).join('');

        // Anotações (antepenúltimo)
        let anotacoesHtml = '';
        if (state.anotacoes.length === 0) {
          anotacoesHtml = '<span style="color:var(--ink-faint);">Nenhuma anotação ainda.</span>';
        } else {
          anotacoesHtml = state.anotacoes.slice().reverse().map(a => `
            <div class="anotacao-box">
              <div class="topo"><span>${a.data}</span><span>${a.hora}</span></div>
              <div class="texto">${a.texto}</div>
            </div>
          `).join('');
        }

        const chartHtml = `<canvas id="weekChart" height="120"></canvas>`;

        const emblemasCompletos = EMBLEMAS.map(e => {
          const feito = state.emblemas.includes(e.id);
          return `<div class="emblema-item ${feito?'feito':''}">
            <span class="nome">${e.emoji} ${e.label}</span>
            <span class="status">${feito ? '✅' : '🔒'}</span>
          </div>`;
        }).join('');

        const totalAnimais = ANIMAIS.length;
        const totalPlant = PLANTACOES.length;
        const totalAvatar = AVATAR_ITENS.length;
        const totalProd = PRODUTOS.length;
        const totalRaros = ITENS_RAROS.length;
        const totalInvest = INVESTIMENTOS.length;
        const totalEventos = EVENTOS.length;
        const totalDoacoes = PRODUTOS_DOACAO.length;
        const coletados = Object.keys(state.animais).filter(k=>state.animais[k]).length +
          Object.keys(state.plantacoes).filter(k=>state.plantacoes[k]).length +
          Object.keys(state.avatar).filter(k=>state.avatar[k]).length +
          Object.keys(state.produtos).filter(k=>state.produtos[k]).length +
          state.itensRaros.length +
          state.investimentos.length +
          state.eventosConcluidos.length +
          Object.keys(state.doacoesDoadas).filter(k=>state.doacoesDoadas[k]).length;
        const totalColecionaveis = totalAnimais + totalPlant + totalAvatar + totalProd + totalRaros + totalInvest + totalEventos + totalDoacoes;

        return `
          <div class="card">
            <h2>🛠️ Ferramentas</h2>
            <div class="btn-row">
              <button class="btn" onclick="App.exportBackup()">💾 Exportar Backup</button>
              <button class="btn" onclick="document.getElementById('importFile').click()">📂 Importar Backup</button>
              <button class="btn rose" onclick="App.resetTudo()">🔄 Resetar Tudo</button>
              <input type="file" id="importFile" accept="application/json" style="display:none;">
            </div>
          </div>
          <div class="card">
            <h2>👤 Editar Perfil</h2>
            <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
              <input type="text" id="nomeInput" value="${state.avatarNome}" placeholder="Seu nome" style="background:var(--surface-solid);border:2px solid var(--border);border-radius:10px;padding:8px 12px;color:var(--ink);font-size:16px;flex:1;min-width:150px;">
              <button class="btn gold" onclick="App.mudarNome(document.getElementById('nomeInput').value)">Salvar Nome</button>
            </div>
            <div class="sex-selector" style="margin-top:10px;">
              <button class="${state.avatarSexo === 'unisex'?'active':''}" onclick="App.mudarSexo('unisex')">🧑 Unisex</button>
              <button class="${state.avatarSexo === 'masculino'?'active':''}" onclick="App.mudarSexo('masculino')">👨 Masculino</button>
              <button class="${state.avatarSexo === 'feminino'?'active':''}" onclick="App.mudarSexo('feminino')">👩 Feminino</button>
            </div>
          </div>
          <div class="card">
            <h2>📊 Estatísticas</h2>
            <div class="grid-cards">
              <div class="item-card"><div class="emoji">🔥</div><div class="name">${state.pomodoros.total}</div><div class="meta">Pomodoros</div></div>
              <div class="item-card"><div class="emoji">💰</div><div class="name">R$ ${state.dinheiro}</div><div class="meta">Dinheiro</div></div>
              <div class="item-card"><div class="emoji">🐄</div><div class="name">${Object.keys(state.animais).filter(k=>state.animais[k]).length}</div><div class="meta">Animais</div></div>
              <div class="item-card"><div class="emoji">🌱</div><div class="name">${Object.keys(state.plantacoes).filter(k=>state.plantacoes[k]).length}</div><div class="meta">Plantações</div></div>
              <div class="item-card"><div class="emoji">🎨</div><div class="name">${Object.keys(state.avatar).filter(k=>state.avatar[k]).length}</div><div class="meta">Avatar</div></div>
              <div class="item-card"><div class="emoji">🧀</div><div class="name">${Object.keys(state.produtos).filter(k=>state.produtos[k]).length}</div><div class="meta">Produtos</div></div>
              <div class="item-card"><div class="emoji">🎉</div><div class="name">${state.eventosConcluidos.length}</div><div class="meta">Eventos</div></div>
              <div class="item-card"><div class="emoji">🚜</div><div class="name">${state.investimentos.length}</div><div class="meta">Investimentos</div></div>
              <div class="item-card"><div class="emoji">🏅</div><div class="name">${state.emblemas.length}</div><div class="meta">Emblemas</div></div>
              <div class="item-card"><div class="emoji">✨</div><div class="name">${state.itensRaros.length}</div><div class="meta">Itens Raros</div></div>
              <div class="item-card"><div class="emoji">💝</div><div class="name">${Object.keys(state.doacoesDoadas).filter(k=>state.doacoesDoadas[k]).length}</div><div class="meta">Doações</div></div>
              <div class="item-card"><div class="emoji">📦</div><div class="name">${coletados}/${totalColecionaveis}</div><div class="meta">Coleção</div></div>
            </div>
          </div>
          <div class="card">
            <h2>📈 Últimos 7 dias</h2>
            ${chartHtml}
          </div>
          <div class="card">
            <h2>🏅 Todos os Emblemas</h2>
            <div style="max-height:300px;overflow-y:auto;">${emblemasCompletos}</div>
          </div>
          <div class="card">
            <h2>📝 Anotações por Pomodoro</h2>
            <div class="anotacao-input">
              <input type="text" id="anotacaoInput" placeholder="Escreva sua anotação..." />
              <button class="btn small gold" onclick="App.adicionarAnotacao(document.getElementById('anotacaoInput').value)">Salvar</button>
              <button class="btn small" onclick="App.exportarAnotacoesCSV()">📥 CSV</button>
            </div>
            <div style="max-height:250px;overflow-y:auto;">
              ${anotacoesHtml}
            </div>
          </div>
          <div class="card">
            <h2>📢 Notificações</h2>
            <div style="max-height:250px;overflow-y:auto;">${notificacoesHtml || '<p class="empty">Nenhuma notificação.</p>'}</div>
          </div>
        `;
      }

      function renderAll() {
        atualizarStats();
        const main = document.getElementById('main');
        let html = '<div class="page">';
        if (currentTab === 'foco') html += renderFoco();
        else if (currentTab === 'rocar') html += renderRocar();
        else if (currentTab === 'produzir') html += renderProduzir();
        else if (currentTab === 'eventos') html += renderEventos();
        else if (currentTab === 'feira') html += renderFeira();
        else if (currentTab === 'progresso') html += renderProgresso();
        html += '</div>';
        main.innerHTML = html;
        if (currentTab === 'foco') renderTimerFace();
        if (currentTab === 'progresso') {
          document.getElementById('importFile').onchange = function(e) {
            if (e.target.files[0]) importBackup(e.target.files[0]);
          };
          drawChart();
        }
        updateBackToTop();
      }

      // =============================================================
      // GRÁFICO
      // =============================================================
      let chartInstance = null;

      function drawChart() {
        const ctx = document.getElementById('weekChart');
        if (!ctx) return;
        const days = [];
        const counts = [];
        const now = new Date();
        for (let i=6; i>=0; i--) {
          const d = new Date(now);
          d.setDate(now.getDate() - i);
          const key = d.toISOString().slice(0,10);
          days.push(d.toLocaleDateString('pt-BR', { weekday: 'short' }));
          const diario = state.pomodorosDiarios.find(item => item.data === key);
          counts.push(diario ? diario.count : 0);
        }
        if (chartInstance) chartInstance.destroy();
        chartInstance = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: days,
            datasets: [{
              label: 'Pomodoros',
              data: counts,
              backgroundColor: '#6b8c42',
              borderRadius: 4
            }]
          },
          options: {
            plugins: { legend: { display: false } },
            scales: {
              y: { beginAtZero: true, ticks: { stepSize: 1, color: '#8a7e6b' } },
              x: { ticks: { color: '#8a7e6b' } }
            }
          }
        });
      }

      // =============================================================
      // BACKUP / RESET
      // =============================================================
      function exportBackup() {
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'fazenda_backup.json';
        a.click();
        URL.revokeObjectURL(url);
        toast('💾 Backup exportado!');
      }

      function importBackup(file) {
        const reader = new FileReader();
        reader.onload = e => {
          try {
            const parsed = JSON.parse(e.target.result);
            state = Object.assign(defaultState(), parsed);
            saveState();
            renderAll();
            toast('✅ Backup importado!');
          } catch (err) {
            toast('⚠️ Erro ao importar backup.');
          }
        };
        reader.readAsText(file);
      }

      function resetTudo() {
        if (!confirm('Resetar todo progresso?')) return;
        state = defaultState();
        saveState();
        renderAll();
        toast('🔄 Tudo resetado.');
      }

      // =============================================================
      // THEME
      // =============================================================
      function applyTheme() {
        document.documentElement.setAttribute('data-theme', state.theme);
        document.getElementById('themeToggle').textContent = state.theme === 'dark' ? '☀️' : '🌙';
      }

      function toggleTheme() {
        state.theme = state.theme === 'dark' ? 'light' : 'dark';
        saveState();
        applyTheme();
        if (currentTab === 'progresso') drawChart();
      }

      // =============================================================
      // BOTÃO VOLTAR AO TOPO
      // =============================================================
      function updateBackToTop() {
        const btn = document.getElementById('backToTop');
        if (window.scrollY > 300) {
          btn.classList.add('visible');
        } else {
          btn.classList.remove('visible');
        }
      }

      window.addEventListener('scroll', updateBackToTop);

      document.getElementById('backToTop').addEventListener('click', function() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

      // =============================================================
      // EXPOSE
      // =============================================================
      window.App = {
        toggleRunning,
        resetTimer,
        manualComplete,
        adquirirItem,
        produzirProduto,
        venderProduto,
        produzirDoacao,
        doarProduto,
        comprarInvestimento,
        comprarItemRaro,
        participarEvento,
        mudarSexo,
        mudarNome,
        adicionarAnotacao,
        exportarAnotacoesCSV,
        setSubTabRocar: (tab) => { subTabRocar = tab; renderAll(); },
        setSubTabProduzir: (tab) => { subTabProduzir = tab; renderAll(); },
        fecharTutorial: () => { state._tutorialVisto = true; saveState(); renderAll(); },
        exportBackup,
        resetTudo
      };

      // =============================================================
      // INIT
      // =============================================================
      function init() {
        buildNav();
        applyTheme();
        document.getElementById('themeToggle').onclick = toggleTheme;
        renderAll();
        startTimerLoop();
        saveState();
        if (!state._tutorialVisto) {
          setTimeout(() => toast('🌱 Clique em "Entendi!" no balão para começar'), 500);
        }
        verificarEmblemas();
        verificarEventos();
        updateBackToTop();
      }

      document.addEventListener('DOMContentLoaded', init);
    })();
  </script>
</body>
</html>
